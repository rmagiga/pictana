name: pictana
description: "ローカルストレージ上の画像を閲覧・管理するための Flutter デスクトップ/モバイルアプリケーション"
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状態管理 (§4.1)
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.2

  # 画像表示 (§4.2)
  extended_image: ^10.0.1

  # データベース (§4.3)
  drift: ^2.31.0 # analyzer 9.x 制約 (flutter_test の meta 1.17.0 固定による)
  sqlite3_flutter_libs: ^0.5.29

  # キャッシュ (§4.5)
  flutter_cache_manager: ^3.4.1

  # Utility (§4.6)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0 # analyzer 9.x 制約 (json_serializable 6.13.x が要求)
  path: ^1.9.1
  path_provider: ^2.1.5
  collection: ^1.19.1
  characters: ^1.3.0
  logger: ^2.7.0
  exif: ^3.3.0

  # ストレージ選択 (§10.2)
  file_picker: ^11.0.2

  # ルーティング
  go_router: ^17.2.3
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  flutter_launcher_icons: ^0.14.4
  desktop_drop: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Property-based testing
  glados:
    git:
      url: https://github.com/MarcelGarus/glados
      path: glados

  # コード生成
  build_runner: ^2.15.0
  drift_dev: ^2.31.0 # analyzer 9.x 制約 (flutter_test の meta 1.17.0 固定による)
  freezed: ^3.2.5 # analyzer 9.x 制約 (>=9.0.0 <11.0.0)
  json_serializable: ^6.11.0 # analyzer 9.x 制約 (>=9.0.0 <11.0.0)
  riverpod_generator: ^4.0.3 # analyzer 9.x 制約 (^9.0.0)
  melos: ^7.8.0


dependency_overrides:
  test_api: 0.7.12

flutter:

  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 48
